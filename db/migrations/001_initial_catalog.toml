# Initial catalog and content-processing schema.
# Provider/model identifiers intentionally remain TEXT so they can evolve
# independently from the database schema.

[[actions]]
type = "custom"
start = "CREATE EXTENSION IF NOT EXISTS pgcrypto"

[[actions]]
type = "create_enum"
name = "catalog_status"
values = ["queued", "enriching", "ready", "failed", "retired"]

[[actions]]
type = "create_enum"
name = "document_kind"
values = ["product_page", "manual", "scrape_snapshot", "other"]

[[actions]]
type = "create_enum"
name = "document_status"
values = ["discovered", "fetching", "ready", "failed", "stale"]

[[actions]]
type = "create_enum"
name = "asset_kind"
values = ["scan_image", "product_image", "manual_pdf", "source_snapshot", "guide_video", "guide_thumbnail", "step_visual"]

[[actions]]
type = "create_enum"
name = "guide_status"
values = ["draft", "generating", "ready", "failed", "retired"]

[[actions]]
type = "create_enum"
name = "scan_status"
values = ["uploaded", "recognizing", "matched", "fallback_queued", "failed"]

[[actions]]
type = "create_enum"
name = "match_method"
values = ["item_number", "alias", "fuzzy_name", "fallback_scrape", "manual_review"]

[[actions]]
type = "create_enum"
name = "job_kind"
values = ["catalog_seed", "product_discovery", "manual_fetch", "manual_parse", "guide_generation", "video_render", "fallback_scrape"]

[[actions]]
type = "create_enum"
name = "job_status"
values = ["pending", "running", "succeeded", "failed", "cancelled"]


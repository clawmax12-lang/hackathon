[[actions]]
type = "custom"
start = """
ALTER TABLE products
  ADD CONSTRAINT products_popularity_rank_positive
  CHECK (popularity_rank IS NULL OR popularity_rank > 0);
ALTER TABLE media_assets
  ADD CONSTRAINT media_assets_has_location
  CHECK (storage_key IS NOT NULL OR source_url IS NOT NULL),
  ADD CONSTRAINT media_assets_byte_size_nonnegative
  CHECK (byte_size IS NULL OR byte_size >= 0);
ALTER TABLE source_documents
  ADD CONSTRAINT source_documents_page_count_positive
  CHECK (page_count IS NULL OR page_count > 0);
ALTER TABLE assembly_steps
  ADD CONSTRAINT assembly_steps_number_positive
  CHECK (step_number > 0),
  ADD CONSTRAINT assembly_steps_duration_nonnegative
  CHECK (estimated_seconds IS NULL OR estimated_seconds >= 0);
ALTER TABLE generated_videos
  ADD CONSTRAINT generated_videos_duration_nonnegative
  CHECK (duration_seconds IS NULL OR duration_seconds >= 0);
ALTER TABLE furniture_scans
  ADD CONSTRAINT furniture_scans_confidence_range
  CHECK (match_confidence IS NULL OR match_confidence BETWEEN 0 AND 1);
ALTER TABLE ingestion_batches
  ADD CONSTRAINT ingestion_batches_expected_items_positive
  CHECK (expected_items IS NULL OR expected_items > 0);
ALTER TABLE ingestion_jobs
  ADD CONSTRAINT ingestion_jobs_attempts_valid
  CHECK (attempt_count >= 0 AND max_attempts > 0 AND attempt_count <= max_attempts);
ALTER TABLE job_attempts
  ADD CONSTRAINT job_attempts_number_positive
  CHECK (attempt_number > 0),
  ADD CONSTRAINT job_attempts_tokens_nonnegative
  CHECK ((input_tokens IS NULL OR input_tokens >= 0) AND (output_tokens IS NULL OR output_tokens >= 0)),
  ADD CONSTRAINT job_attempts_cost_nonnegative
  CHECK (estimated_cost_usd IS NULL OR estimated_cost_usd >= 0);
"""

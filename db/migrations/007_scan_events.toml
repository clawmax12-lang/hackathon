# Persist every scan event so progress survives API restarts and clients can
# reconnect without depending on an in-memory process.

[[actions]]
type = "custom"
start = """
CREATE TABLE scan_events (
  id BIGSERIAL PRIMARY KEY,
  scan_id UUID NOT NULL REFERENCES furniture_scans(id) ON DELETE CASCADE,
  event_type TEXT NOT NULL,
  payload JSONB NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

CREATE INDEX scan_events_scan_id_id_idx ON scan_events (scan_id, id);
"""

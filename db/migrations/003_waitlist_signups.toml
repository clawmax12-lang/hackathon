# Email waitlist signups collected from the marketing landing page (public/landing.html).

[[actions]]
type = "create_table"
name = "waitlist_signups"
primary_key = ["id"]

  [[actions.columns]]
  name = "id"
  type = "UUID"
  nullable = false
  default = "gen_random_uuid()"

  [[actions.columns]]
  name = "email"
  type = "TEXT"
  nullable = false

  [[actions.columns]]
  name = "source"
  type = "TEXT"
  nullable = false
  default = "'landing'"

  [[actions.columns]]
  name = "created_at"
  type = "TIMESTAMPTZ"
  nullable = false
  default = "NOW()"

[[actions]]
type = "add_index"
table = "waitlist_signups"
  [actions.index]
  name = "waitlist_signups_email_unique"
  columns = ["email"]
  unique = true
